违背记录可以放在对应的判断下面。健康约束，我没有理解为什么要给脚本读。你指的脚本是什么？脚本不具备判断力，他读这个有什么用呢？你写 一个内容，它一定是给读者看的，那你一定要有读者。如果没有读者，那它就没有存在的意义。如果它只写给人看，那你这个项目纪律又不是人来执行。整个项目都是给 AI 看的。给 AI 看应该放在哪里呢？
英文命名，定稿吧。然后改动一起做，Skill 和契约另外起一个 ADR 吧。
我我需要你解释一下 ADR 是个什么东西。我的担心是你把项目又变成了一套非常复杂的自我强化的约束体系，并且丧失了它的灵活性。因为在这个会话里，你好像一直在抛出新的可改进点，但它们有必要改进吗？
'''

