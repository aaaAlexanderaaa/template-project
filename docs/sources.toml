# 前端设计与交互规范（Frontend Design Specification）

## 第一部分：参考的行业标准与代表产品

设计或重构前端界面时，请对齐以下五个成熟的设计规范与人机交互原则，不要使用常见的营销网页模板或组件库默认的高对比度样式：

| 维度 | 参考标准与代表产品 | 具体做法 | 解决的问题 |
| --- | --- | --- | --- |
| **视觉层次** | **Apple Human Interface Guidelines**（macOS 原生桌面规范；参考 macOS 系统设置、Things 3、Craft） | 底层使用浅灰色背景（Canvas），筛选条件、辅助说明等次要内容直接放在浅灰背景上，不加边框和阴影；只有当前最核心的工作区放进一块纯白面板（Platter），配极淡的自然阴影；下拉菜单和浮层使用半透明毛玻璃。 | 不用画满屏的 `1px` 分割线，也避免了到处套卡片导致满屏都是方框。 |
| **注意力管理** | **Calm Technology**（平静技术，Mark Weiser）+ **Data-Ink Ratio**（数据墨水比，Edward Tufte） | 删掉无意义的装饰线条、彩色徽章和图标。主要内容放在视觉中心；次要功能和结构信息用浅色小字退到页面边缘保留提示，鼠标移过去或点击时再展开完整内容。 | 避免刺眼元素干扰视线，同时保证次要信息随时看得见、找得到。 |
| **位置与操作一致性** | **Recognition over Recall**（识别优于记忆）+ **空间位置一致性**（Jef Raskin；参考 macOS 顶部菜单栏与 `NSToolbar`） | 所有功能保留看得见的固定入口，菜单和按钮的排列顺序固定不变；功能暂不可用时原地置灰，不隐藏也不动态调整顺序；不强迫用户背诵快捷键或依赖 `Cmd+K` 命令框。 | 保证名称、布局、状态与实际行为严格对应，保护肌肉记忆，防止界面自己变动导致找不到按钮。

 |
| **多尺寸窗口适配** | **Intrinsic Web Design**（内在响应式设计，使用 CSS `@container`）+ **Priority+ 渐进折叠模式**（参考 Linear 桌面端、TablePlus） | 给主工作区设定最大宽度上限；窗口变窄时，按业务重要程度依次收起侧边栏和次要表格列，放不下的顶部工具按钮按原顺序收入末尾的 `···` 菜单。 | 同一套桌面页面在窄分屏（500px）、半屏（800px）、标准窗口（1200px）和 34 寸超宽屏（3440px）下都能正常使用。 |
| **长文批注排版** | **Tufte Sidenotes**（页边注排版；参考 Readwise Reader、Stripe 文档内页） | 窗口足够宽时，注释和批注直接对齐正文段落排在右侧空白处；窗口变窄放不下时，点击标记在当前行下方或就近浮层展开，不跳到文章末尾。 | 阅读长文时随手就能看注释，不打断阅读位置。 |

