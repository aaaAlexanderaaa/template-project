## 第三部分：具体样式参数、窗口断点与禁用清单

### 3.1 基础 CSS 变量参考值

默认采用柔和护眼的浅灰底色配深灰文字，避免纯白底（`#FFFFFF`）配纯黑字（`#000000`）造成刺眼反差：

```css
:root {
  /* 1. 背景与面板分层 —— 底层浅灰（可选中性浅灰 #F5F5F7 或偏冷浅灰 #F2F4F8），主面板纯白 */
  --bg-canvas: #F5F5F7;
  --bg-platter: #FFFFFF;
  --bg-subtle-hover: rgba(0, 0, 0, 0.035);
  --bg-vibrancy: rgba(255, 255, 255, 0.78); /* 浮层与吸顶栏毛玻璃，配合 backdrop-filter: blur(16px) saturate(140%) */

  /* 2. 文字颜色层级 —— 避免使用纯黑 #000000 */
  --ink-primary: #1D1D1F;            /* 标题、正文、核心数据 */
  --ink-secondary: #51555E;          /* 次要字段、表头、常驻菜单文字 */
  --ink-tertiary: #868B96;           /* 辅助说明、时间戳、已收起列提示 */

  /* 3. 细线与阴影 —— 浅淡边线 + 自然柔和阴影，禁止厚重黑影 */
  --hairline: rgba(0, 0, 0, 0.065);  /* 列表分割线、树状缩进引导线 */
  --platter-border: rgba(0, 0, 0, 0.05);
  --platter-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 6px 20px rgba(0, 0, 0, 0.035);
  --popover-shadow: 0 4px 12px rgba(0, 0, 0, 0.06), 0 16px 36px rgba(0, 0, 0, 0.08);

  /* 4. 低饱和度主色与状态色 —— 仅用于唯一主按钮、6px 状态圆点、极淡批注高亮 */
  --accent-primary: #2F5D8A;         /* 低饱和深蓝（备选深绿 #2E6153 或深炭灰 #22252A） */
  --status-ok: #3B7A57;              /* 柔和绿（正常） */
  --status-warn: #B87333;            /* 琥珀黄（注意/警告） */
  --status-err: #B84040;             /* 暗红（异常/错误） */
  --highlight-wash: rgba(47, 93, 138, 0.08); /* 正文高亮极淡底色 */

  /* 5. 圆角与固定高度 */
  --radius-platter: 10px;            /* 主白板与展开卡片：10px - 12px */
  --radius-control: 6px;             /* 按钮、输入框、菜单项：6px - 8px */
  --topbar-height: 32px;             /* 常驻薄顶栏：28px - 36px */
  --statusbar-height: 28px;          /* 底部计数状态条 */
}

```

### 3.2 桌面窗口宽度适配标准

优先使用 CSS 容器查询（`@container`）控制布局，确保页面在不同分屏比例下都清晰可用：

| 窗口宽度范围 | 常见使用方式 | 布局与收起规则 |
| --- | --- | --- |
| **`< 680px`** | 屏幕 1/3 侧边窄窗口 | 单栏占满窗口（留 `12–16px` 外边距）；顶栏收为“当前视图下拉框 + 1 个主按钮 + `···`”；表格只保留 `2–3` 个最关键的列，其余字段点击该行原地展开；目录与批注全部改为覆盖浮层或行内展开。 |
| **`680px – 1024px`** | 桌面左右半屏并排 | 保持桌面紧凑字号（正文 `14px`）；主面板单栏占满，取消左右双栏并排；表格保留 `4–5` 个核心列，机器长字段留在展开详情里。 |
| **`1024px – 1440px`** | 笔记本全屏 / 标准窗口 | 阅读页正文限制在 `680–720px` 居中，右侧留出 `220–260px` 排布页边批注；数据管理台主面板限制在 `1040–1180px` 居中。 |
| **`> 1440px`（含 34 寸屏）** | 超宽显示器全屏 | **严格限制最大宽度并水平居中**：管理台主面板不超过 `1200px`（带页边注的阅读区总宽不超过 `1080px`），两侧留出干净的 `--bg-canvas` 浅灰背景，禁止 `width: 100%` 铺满全屏。 |

### 3.3 防抖动与特殊数据处理细则

* **消除界面跳动**：
* 滚动容器统一加上 `scrollbar-gutter: stable`，避免内容展开后出现滚动条挤歪页面。
* 顶栏如果中间有标签栏，外层使用三列网格 `display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr)` 把左、中、右隔开；选中后变粗的文字标签必须设定固定宽度，或用隐藏的粗体伪元素提前占好宽度，保证切换时左右零偏移。
* 所有计数、金额、耗时、版本号和表格数字列统一设置 `font-variant-numeric: tabular-nums`。


* **处理长字段、刷新与空结果**：
* **机器长字段收进展开层**：UUID、SHA256、完整文件路径、长串配置在任何屏幕宽度下都默认放在点击展开的详情区，不直接摆在主表表面；确实要在行内显示的标识采用保留首尾、省略中间的做法（如 `prod-gw...8f2a`），鼠标悬停显示完整内容并提供复制按钮。
* **平滑刷新数据**：筛选或定时刷新时保留当前页面数据（`Stale-While-Revalidate`），只在顶栏底部走一条 `2px` 细进度线，不清空画面闪白屏。
* **纯文字空状态**：筛选无结果时，居中显示一行具体原因（如 `当前筛选条件下无匹配记录`）和 `[清空筛选条件]` 按钮，不放插画或表情符号。
* **显示与底层计算一致**：所有筛选计数、图表标记和滑块范围必须与底层实际计算结果严格一致。





---

### 3.4 禁止出现的写法与替代做法

| 禁止出现的写法 | 标准替代做法 |
| --- | --- |
| **左侧彩色粗竖线提示框**（如 `border-left: 4px solid blue`）和满屏彩色胶囊标签 | 补充说明用极淡底色或 `1px` 四周细边框卡片；列表状态统一用 `6px` 低饱和度小圆点配深灰文字。 |
| **同一屏幕重复展示数据**（如表格上方再放一排重复统计数字的大卡片） | 统计数字直接放进筛选标签旁（如 `异常 2`）、表头或底部 `28px` 状态条，同屏只出现一次。 |
| **多层卡片嵌套或三列等宽卡片墙**（白卡里套灰卡、灰卡里再套白卡） | 只保留一层纯白主面板，面板内部靠间距、字号大小和两边内缩的 `1px` 浅灰细横线区分模块。 |
| **默认加横向滚动条的表格**（直接写 `overflow-x: auto` 把右侧状态列藏到屏幕外） | 按列的重要程度设置断点自动隐藏次要列，表头提示已隐藏列数，点击行在下方展开全部字段。 |
| **蓝紫渐变字、霓虹发光边框、标题前加 Emoji（🚀/✨）** | 靠字重对比、对齐和留白建立层次；重要提示直接用纯文字短标记（如 `存疑 ·`）。 |
| **把内部工具做成宣传页**（页面顶部放居中大口号和超大号按钮占掉半屏） | 打开页面第一眼直接展示 `32px` 菜单栏和核心工作面板，不写宣传标语。 |
| **多余动画**（鼠标悬停卡片往上跳、数字滚动动画、慢速淡入淡出） | 悬停和切换只做 `120–160ms` 的轻微背景色或透明度过渡；打开菜单和切换标签立即响应。 |

---

### 3.5 AI 交付代码前的自检清单

每次生成或修改前端代码后，先按以下 6 条逐一核对，全部通过再交付：

1. **拉动窗口宽度**：依次检查 `540px`、`800px`、`1280px` 和 `2560px+` 宽度下，顶栏有没有折行挤乱？普通表格有没有出现横向滚动条？超宽屏有没有按规定居中封顶？
2. **代入真实数据规模**：假设列表有 `500` 条记录、任务有 `4` 层父子嵌套、文档有 `200` 页——滚动方式选对了没有（管理页锁死一屏内部滚，阅读页整页滚）？往下滚深之后，表头、父级路径或顶栏菜单能不能随手点到？
3. **检查位置偏移**：切换标签页、勾选复选框、右侧计数从 `1` 变成 `9,999`、展开行详情出现滚动条时，顶部导航和常驻按钮有没有哪怕 `1px` 的晃动？
4. **检查重复与杂乱**：同一个屏幕里有没有重复出现的数据？UUID、Hash、长路径有没有直接摊在主表表面？次要说明文字有没有降成浅灰色？
5. **核对所见即所得**：所有重要功能是不是都有看得见的固定入口（不用猜快捷键）？空结果提示、筛选数字和底层真实数据是不是完全一致？


6. **排查禁用样式**：检查代码里是否彻底清除了 Emoji 装饰、`border-left` 彩色粗边提示框、多层嵌套卡片、蓝紫渐变和卡片悬停上跳动画。
~~~
'''

[[sources]]
id = "SRC-023"
date = "2026-11-16"
status = "active"
context = "Chronological verbatim source order and substantive-direction inclusion threshold for template-project and adopting repos"
quote = '''
重新修订顺序吧，时间顺序排序，早期的排在前面，我要确保是原话，我不希望你写成了“核心内容”或者什么别的做了处理的东西。另外，我补充，对于整个template-project和采用这一套规范的项目，不是所有原话都sources，而是对项目发展方向产生了实质性影响的才要进去。
'''

[[sources]]
