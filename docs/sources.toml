[[sources]]
id = "SRC-032"
date = "2026-11-25"
status = "active"
context = "Owner direction on building self-correction into the discipline: when and how to subtract, revisiting earlier judgments, project-chosen health constraints instead of fixed numeric limits, and project documents as the only memory a model can rely on"
quote = '''
我同意你的这个思考，的确，如何做减法？在什么场景下做减法？以及在什么时候抛出一个判断，并且在后面验证这个判断。或者能够再回过头来去审判或者审视当时做 的那个判断，然后再来纠正当时的方向。这部分是一个很重要的东西。避免一套工程不断的膨胀，做加法往前走，自我强化。它一定要成为一个循环。在某一些节点，模型或者工程，或者使用这一套工程和纪律的智能是可以回过头去审视自己，去评估自己项目的健康程度的。这种健康程度不是由单一的或者几个数值去作为硬限制，而是由他自己根据项目的状况去 定一个约束，然后根据目标或者使命或者愿景去灵活的、适当的、少量的调整这些约束。也就是说，我们在尝试把自我纠正的能力内化到项目的纪律当中，而不指望 模型时刻记得。因为这里有一个非常本质的问题是，模型是没有记忆的。它的记忆来自于传递给它的上下文，它的上下文来自于项目当中的文档或者 harness。 但 harness 是会自动变化的，它会随着 Agent 能力的更新而变化。只有项目的文档是静态的、可见的，不黑盒的，我们可控的
'''

[[sources]]
id = "SRC-033"
date = "2026-11-25"
status = "active"
context = "Owner's own formulation of the self-correction loop (judgment, expectation, observation, expectation violation, three resolutions), given after the agent proposed a judgment-observation-review-correction loop; the owner then approved drafting ADR-008 with \"同意，开始\""
quote = '''
我理解，我同意你这个思考。你这个思考是正确的方向。但我认为有更 直白和本质的描述，每一个判断对应一个预期。于是 你要检验预期，也就是所谓的观察。你要评估和发现预期违背。那么预期违背呢，就会触发三种选择。第一种是修正预期。也就是，所谓的预期违背是被认可的，是当时的预期错了。第二种是修正现象，也就是现在正在发生的预期违背是错误的，预期是正确的。第三种是接受，或者叫做有一个 更强的描述，他可以把当时的预期和现在的预期违背放在同一个框架里，并且是正确的。只是当时所描述的预期是局部的现象的 局限性的描述。当然你的这一个判断、观察、复盘、纠正的框架也很好。我只是表达一下我的思考。取决于如何以 AI/ Agent / Model 更能理解的方式、更能遵守的方式、更 不产生歧义的方式，更灵活的方式去进行管理，让这个系统稳定，在处理未知的环境的时候仍然保持稳定
'''

