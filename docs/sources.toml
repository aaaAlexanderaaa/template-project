status = "active"
context = "Environment-dependent review and commit-accumulated Grill reminder; preventing Goodhart drift, three-level verbatim lineage, and replacing calendar-day metrics"
quote = '''
A3: 其实取决于项目和模型，比如你是一个比较贵的agent，智力还可以，我就认为没必要不加审查。但如果是一个比较快而且便宜的agent，加个审查无伤大雅。我认为这需要用户显式决策并记录吧，有一个小文档来根据环境决策是否要自动走独立视角审查。grill 既然作为skill了，也应该是用户主动发起，但是agent的确应该根据项目`多少变更没自查了`来作为一个判断依据来提醒用户应该自查一下。
A5: 因为一个元级别的事情是，模型容易把使命和愿景弱化成目标；目标弱化为指标；指标又符合古德哈特定律，导致系统的失败，所以可观测性是很重要的，我需要代码决策在通常情况下符合所谓最佳实践、项目纪律的同时，优先符合用户的需求，但是用户的需求如何不被歪曲，不被照本宣科，或者，AI在grill自己评估项目的健康度的时候，如何确保自己在正确的道路上呢？这就需要能够回溯到关键决策和做出关键决策的上下文和场景，这样才知道当时为什么做那个决策，是否符合现在的需求，是否可以移出或更新之类的。所以我会要求保留一个source，最好直接是原话而不是被转义、翻译过后的话，因为一定会有失真。
我唯二认为有问题的是：
1. 按天来作为记录更新很奇怪，为什么在AI coding时代，代码开发和决策已经和时间没有关系了，还会选择用天作为一种AI的工作计量办法？你用架构方向转变、commit、关键变更、工作量之类的去计量也比用时间合理。
2. 平行记录决策，因果、逻辑、历史、顺序都被抹平了。我更想要的是一种双向关系：系统里的一个设计，是经过哪些source的支持，这些source经历过怎样的变化（也不需要每次都看历史，有疑问的时候可追溯历史），才变成现在这样？曾经的某个需求，如今辐射到了系统的哪些决策？（其实反过来是，有哪些决策/设计是没有考虑哪些原始需求的，是为什么）
'''

