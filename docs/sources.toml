## 第二部分：设计取舍规则与页面分类方法

遇到本文未直接举例的新功能或新页面形态时，先按以下六条规则处理设计冲突，再按页面类型选择布局结构。

### 2.1 六条核心取舍规则

1. **兼顾“看得见”与“画面干净”：固定位置留简短入口，占空间的细节点击再展开**
* **做法**：把按钮全铺在表面会让页面杂乱，全藏进快捷键又会导致“看不见就忘”。应在固定位置保留简短、低调的可见入口（如顶部文字菜单、行尾操作图标、表头标明“已收起 3 列”、父任务旁显示 `3/8`），把占面积的编辑表单、低频参数和给机器看的长字段（UUID、Hash、完整文件路径）收进点击展开层。
* **边界条件**：只有当窗口窄到单行实在摆不下时，才把排在后面的工具栏按钮按原有顺序收进右侧的 `···` 菜单。


2. **突出重点但不过度刺激：压低配角比重，同一屏幕不重复展示相同数据**
* **做法**：靠简化周围环境来突出核心区域——次要文字用浅灰色，去掉表格竖线，只把当前主工作区做成纯白面板。**同一屏幕内绝不重复展示同一份信息**（例如表格里已经有状态统计，禁止在表格上方再放一排大号统计卡片凑版面）。禁止用超大字号、高饱和度彩色标签或跳动动画吸引视线。
* **颜色与渐变的使用条件**：操作越密集、信息越复杂的页面，颜色越要克制（只用黑白灰配少量低饱和度状态圆点）。只有在信息少、阅读负担低的展示页或引导页，才可以在背景边缘少量使用柔和的低饱和度色彩渐变。


3. **保留完整功能但减少操作步骤：提供合理默认值，优先支持原地直接修改**
* **做法**：80% 的常见场景直接提供合理的默认配置，低频选项收进“高级设置”。修改名称、状态、日期等属性时，优先支持点击文字原地修改并自动保存，省去“点编辑 → 弹窗 → 修改 → 点保存”的多余步骤。批量操作按钮平时隐藏，勾选至少一项后再从页面底部浮出批量操作栏。
* **边界条件**：删除重要数据、覆盖关键配置等不可逆操作，必须弹出确认框写清楚影响范围，不能直接静默生效。


4. **保护空间记忆：菜单顺序和控件坐标保持固定**
* **做法**：导航项、工具栏和菜单项的顺序必须固定，禁止做“按使用频率自动排序”或动态推荐。切换标签页、勾选列表、数字从一位数变成四位数、或者页面出现纵向滚动条时，顶部导航和常驻按钮不能有任何像素移动。


5. **处理大量数据与深层结构：保持单一主工作区，补充位置提示与原地展开**
* **做法**：面对几百条数据、三四层父子嵌套或几百页文档时，维持居中的单一主工作区，避免把屏幕拆成三四列狭窄分栏：
* **多层嵌套列表**：用 `1px` 浅灰竖线标明缩进关系；向下滚动较深时，在列表顶部固定显示一行当前所在的父级路径（如 `网关改造 > 证书轮换`）；点开某条复杂任务时，该行原地向下撑开成一张编辑白卡，并在白卡上下各留出 `12px` 空白，防止与上下相邻的层级混在一起。
* **长文档跨页跳转**：点击目录或引用跳到远处页码后，在角落显示一个临时的 `返回第 X 页` 小按钮，点完即消失。




6. **适配不同比例的桌面窗口：超宽屏限制最大宽度居中，窄窗口按重要程度依次收起**
* **做法**：桌面端窄窗口依然用鼠标和键盘操作，窗口变窄时保持桌面紧凑字号，不要放大成手机端的大号按钮。
* **超宽屏处理**：禁止让工作区 `100%` 铺满 34 寸显示器；主内容区必须设定最大宽度并水平居中，两侧留出浅灰背景。
* **窄窗口处理**：宽度不足时，先收起左右并排的侧边栏（改为点击滑出抽屉），再按业务重要程度隐藏表格的次要列（点击该行可在下方展开查看全部字段）。除了需要并排核对十几列原始数据的审计宽表外，普通表格禁止直接加横向滚动条（`overflow-x: auto`）应付。





---

### 2.2 四类页面的布局与交互规则

形式服从内容和用途。遇到任何新页面，先看它的**任务特点**与**阅读操作负担**，归入以下四类之一：

| 页面类型 | 适用场景举例 | 页面滚动方式 | 顶部工具与导航 | 排版与颜色约束 |
| --- | --- | --- | --- | --- |
| **1. 数据操作与管理页**<br>

<br>（信息多、操作密集） | 监控面板、路由/日志表、几百条嵌套待办、数据库客户端、代码对比（Diff）、节点编排 | 外框锁死一屏高（`100dvh`），仅主列表内部滚动；表头吸顶，底部固定 `28px` 状态条显示“当前显示条数 / 总条数” | `32px` 单行固定顶栏；窄窗口自动收为“视图下拉框 + 1 个主按钮 + `···` 菜单” | 紧凑无衬线字体，数值列开启等宽数字对齐；精确查值、穷举与审计统一使用无竖线表格；状态只用 `6px` 小圆点，不使用背景渐变。

 |
| **2. 长文阅读与研究页**<br>

<br>（篇幅长、需连续专注） | 百页技术文档、论文阅读批注、源码导读、长篇分析报告、知识库正文 | 整页随文档自然滚动（`min-height: 100dvh`），当前章节路径在顶部吸顶 | `32px` 常驻薄顶栏 + 左侧按需滑出的单抽屉（抽屉内切换目录、全文搜索、批注列表） | 大标题可用现代衬线体，正文用无衬线体；宽屏时批注排在右侧浅灰背景上（鼠标悬停时用 `1px` 浅灰细横线连向对应正文），窄屏点击标记就近展开；正文高亮用极淡底色。 |
| **3. 日常轻量工具页**<br>

<br>（操作简单、快速进出） | 格式转换工具、短流程配置向导、日常时间规划、小型独立工具 | 内容少时单屏居中展示；内容超过一屏时整页自然滚动 | 极简顶部单行导航，或不设导航栏直接居中放置主白板 | 留白适中；默认只展示必填项和唯一主按钮，低频参数收进“高级设置”折叠区。 |
| **4. 展示与导览页**<br>

<br>（操作负担低、重在表达） | 产品主页、项目导览封面、作品集、专题创作页 | 整页自然滚动，内部网格随容器宽度平滑调整列数 | 简洁顶栏或居中胶囊标签栏（每个标签固定宽度，切换时不发生位移） | 标题字号可随容器宽度平滑缩放，可使用衬线字体；允许在背景边缘少量使用柔和的低饱和度色彩过渡。 |

