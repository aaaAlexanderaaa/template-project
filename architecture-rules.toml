version = 2
status = "configured"
rationale = "Module dependencies are owned primarily by `depends_on` in `docs/specs/**/*.md`; literal cross-cutting pattern guards live here."

[[rules]]
id = "projectlib-core-does-not-import-http-server"
description = "Data loading, AST scanning, and validation stay pure and never depend on the HTTP web server layer."
include = [
  "scripts/projectlib/__init__.py",
  "scripts/projectlib/model.py",
  "scripts/projectlib/frontmatter.py",
  "scripts/projectlib/doc_inventory.py",
  "scripts/projectlib/loader.py",
  "scripts/projectlib/import_scanner.py",
  "scripts/projectlib/git_telemetry.py",
  "scripts/projectlib/prose_checks.py",
  "scripts/projectlib/validator.py",
  "scripts/projectlib/context_pack.py",
  "scripts/projectlib/briefing_pack.py",
]
exclude = []
forbidden_patterns = ["http.server", "projectlib.server"]

[[rules]]
id = "reference-domain-stays-pure"
description = "Domain models in the reference exemplar do not import UI or feature orchestration layers."
include = ["examples/reference-app/domain/**"]
exclude = []
forbidden_patterns = ["features.", "from features", "app."]
