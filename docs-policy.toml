"adoption-assessment.md" = ["Adoption context", "Existing authority inventory", "Current-state baseline", "Governance profile and scope", "Priority and decision authority", "Risk and conflict register", "Stage decision", "Migration plan link", "Verification and completion", "Limitations"]
