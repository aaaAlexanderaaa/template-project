version = 2
discipline_version = "2026.11.2"

[project]
# "template" in template-project itself; change to "product" when adopting.
identity = "template"
# Default maturity stage when a domain does not override it:
# "prototype" (0->0.1) | "usable" (0.1->1) | "stable" (1->N)
default_stage = "stable"

[collaboration]
# "interactive" (human in the loop) | "unattended" (standing autonomous charter)
mode = "interactive"
# "frontier" (high-cost strong reasoning model) | "fast" (high-throughput loop)
model_tier = "frontier"
# In interactive mode with a frontier model, skip automatic multi-subagent review
# unless an irreversible high-risk boundary is crossed; keep Grill on-demand.
auto_independent_review = false
# Mechanical change-accumulation thresholds (never calendar days!) after which
# `project.py status` / `check_docs.py` suggests an optional holistic check or /grill.
grill_cadence_commits = 12
grill_cadence_modules = 4
review_anchor_sha = "cb9e90a"

[adoption]
# "observed" (report gaps, exit 0) | "scoped_enforcement" | "adopted" (enforce all)
stage = "adopted"
managed_paths = []

[layout]
# Directories or root files containing governed implementation code.
# Adopters set this to e.g. ["src"], ["app", "packages"], or ["cmd", "internal"].
source_roots = ["scripts", "examples/reference-app"]
placeholder_names = ["README.md", ".gitkeep"]
# Non-product tooling, tests, and config exempt from unclaimed-source errors.
harness_paths = [
  "tests",
  "templates",
  "archive",
  "docs",
  ".agents",
  "tmp",
]

[budgets]
# Mechanical anti-monolith thresholds (counted on tracked source & style files).
max_source_lines = 500
max_style_lines = 300
forbid_catchall_dirs = ["utils", "helpers", "common", "misc"]

[commands]
test = "python3 -m unittest discover -s tests -p 'test_*.py'"

[severity]
broken_links_and_ids = "error"
source_ownership = "error"
import_boundaries = "error"
file_size_budget = "error"
missing_role_header = "error"
unknown_task_specs = "error"
catchall_directories = "error"
orphan_active_sources = "advisory"
git_doc_lag = "advisory"
startup_disclaimers = "error"
